services:
  gaia-control-center:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaia-control-center
    restart: unless-stopped
    # network_mode: host allows direct communication with local health endpoints
    # (127.0.0.1:8643, 127.0.0.1:9119) and the Tailscale IP (100.65.0.15) on Ubuntu Linux
    network_mode: host
    volumes:
      # Read-only Docker engine socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Allow updating registry without rebuilding image
      - ./backend/registry.yaml:/app/registry.yaml
    environment:
      - PORT=8899
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-gaia2026}
      - SECRET_KEY=${SECRET_KEY:-gaia-super-secret-command-center-token}
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - REGISTRY_PATH=/app/registry.yaml
      - TAILSCALE_HOST=100.65.0.15
      # Ingestie Gateway van Foundation (bron voor de Ingestie-tab).
      # FOUNDATION_API_TOKEN is verplicht voor die tab (Bearer-auth op /api/ingest-logs).
      - FOUNDATION_API_URL=${FOUNDATION_API_URL:-http://100.65.0.15:4577}
      - FOUNDATION_API_TOKEN=${FOUNDATION_API_TOKEN:-}
      # Cognition-service (bron voor de Hypothesen-tab). Lifecycle-eigenaar;
      # geen auth (Tailscale-gebonden), net als Hindsight. Bank-id is 'gaia'.
      - COGNITION_URL=${COGNITION_URL:-http://100.65.0.15:8890}
      - COGNITION_BANK_ID=${COGNITION_BANK_ID:-gaia}
      # Optioneel: Bearer-token voor Gaia API health endpoints achter auth
      - GAIA_API_TOKEN=${GAIA_API_TOKEN:-}
    env_file:
      - path: .env
        required: false
