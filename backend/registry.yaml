version: "2.0"

# GAIA V3 ARCHITECTUURMATRIX
# Doelstructuur: 5 repositories (Gaia-Cloud, Foundation, capture-rs,
# gaia-desktop, gaia-web). Het harnas is Gaia; het model is vervangbaar.
# Geheugenpijp (eenrichting): Foundation/Chronicle (observation)
#   -> Hindsight (interpretation/hypothesis) -> Logos (beoordeling/reflectie).
# Alleen menselijke bevestiging promoveert naar `confirmed` (Absolute Override).
# IntentIQ & ReasonIQ zijn gepensioneerd als losse lagen en opgegaan in Logos.
# Veldlegenda per component:
#   layer: harnas | geheugenpijp | capabilities | clients
#   epistemic: agency | observation | interpretation | hypothesis | execution | presence
#   lifecycle: active | interim | planned
#   health_auth_env: naam van env-var met Bearer-token (optioneel)

# HARNAS — Gaia Cloud: agency, SOUL, orkestratie, Response Engine
components:
  - id: "core"
    name: "Gaia API / Core"
    category: "core"
    layer: "harnas"
    epistemic: "agency"
    lifecycle: "active"
    repo: "Gaia-Cloud (services/gaia-api)"
    description: "Het harnas: centrale agency, SOUL, turn-orchestratie en Response Engine (enige expressiegrens naar clients)"
    container: "gaia-api"
    health_endpoint: "http://100.65.0.15:8891/health"
    ui_url: "http://100.65.0.15:8891/admin"
    ui_label: "Open Gaia Admin"
    config_source: "/root/gaia/services/gaia-api/.env"
    configurable: true
    v3_note: "Admin surface: Logos-beslislog, LLM-call-log, provider/rollen-config, TTS-config (operator-only, Bearer)"

  - id: "logos"
    name: "Logos"
    category: "logos"
    layer: "harnas"
    epistemic: "interpretation"
    lifecycle: "active"
    repo: "Gaia-Cloud (services/gaia-api/src/logos)"
    description: "Geconsolideerde reflectieve faculteit (ex-IntentIQ/ReasonIQ/DecisionIQ): retrospectieve intentie, betekenis & evidentie, besluitvorming. Reflecteert, handelt niet."
    host_component: "core"
    ui_url: "http://100.65.0.15:8891/admin"
    ui_label: "Logos Beslislog"
    configurable: false
    v3_note: "IntentIQ & ReasonIQ zijn gepensioneerd als losse lagen (architectuurbesluit sep 2026). Timing live-vs-achtergrondreflectie is nog een open V3-besluit."

  - id: "hermes"
    name: "Hermes Agent"
    category: "reasoning"
    layer: "capabilities"
    epistemic: "execution"
    lifecycle: "active"
    repo: "extern (hermes-agent)"
    description: "Extern executie-instrument onder Gaia's regie (HADES: geen eigen identiteit, geen duurzaam geheugen, geen epistemische autoriteit)"
    container: "hermes"
    auxiliary_containers:
      - "gaia-hermes-proxy"
    health_endpoint: "http://127.0.0.1:8643/v1/models"
    ui_url: "http://100.65.0.15:9119"
    ui_label: "Open Hermes Dashboard"
    config_source: "/root/hermes-agent/.env"
    configurable: false
    v3_note: "Werkgeheugen is tijdelijk; duurzame uitkomsten keren alleen met herkomst en voorlopige status terug"

  - id: "hindsight"
    name: "Hindsight"
    category: "memory"
    layer: "geheugenpijp"
    epistemic: "interpretation"
    lifecycle: "active"
    repo: "extern (Hindsight provider)"
    description: "Externe, vervangbare geheugenprovider: bewaart en herhaalt begrip (memories, feiten, patronen, hypotheses). Persisteert; redeneert niet."
    container: "hindsight"
    health_endpoint: "http://100.65.0.15:8888/health"
    ui_url: "http://100.65.0.15:9999/dashboard"
    ui_label: "Open Hindsight UI"
    config_source: "/opt/hindsight/.env"
    configurable: false
    v3_note: "Bank 'bojan'. Reflectie-pijp Foundation->Hindsight stuurt mens-bevestigde feiten door met provenance"

  - id: "foundation"
    name: "Foundation (Chronicle)"
    category: "knowledge"
    layer: "geheugenpijp"
    epistemic: "observation"
    lifecycle: "active"
    repo: "Foundation"
    description: "De stekkerdoos: bronarchief (Chronicle), Ingestie Gateway (/api/ingest/*, alles observation) en MCP-server. Enige epistemische bron."
    runtime: "pm2"
    process_name: "chronicle"
    health_endpoint: "http://100.65.0.15:4577/api/settings/status"
    ui_url: "http://100.65.0.15:4577/ui/"
    ui_label: "Open Foundation UI"
    config_source: "/opt/Foundation/.env"
    configurable: false
    v3_note: "PM2 'chronicle' (index.js + memory-proces :4578 loopback). Status-endpoint is publiek; ingest/diagnostiek vereist Bearer. 0.0.0.0-binding verboden."

  - id: "cognition"
    name: "Cognition Service"
    category: "cognition"
    layer: "geheugenpijp"
    epistemic: "hypothesis"
    lifecycle: "interim"
    repo: "Gaia-Cloud (services/cognition)"
    description: "Interim opslag- en API-laag voor patronen en hypothese-lifecycle (proposed → testing → confirmed/rejected)"
    container: "gaia-cognition"
    auxiliary_containers:
      - "gaia-cognition-db"
    health_endpoint: "http://100.65.0.15:8890/health"
    config_source: "/opt/gaia-cognition/.env"
    configurable: false
    v3_note: "V3-eigenaarschap van hypothesevorming vs. opslag (Logos/Hindsight/cognition) is nog een open besluit"

  - id: "mcp"
    name: "MCP Server"
    category: "integration"
    layer: "capabilities"
    epistemic: "execution"
    lifecycle: "active"
    repo: "Foundation (server/mcpServer.js)"
    description: "Een API waar alle clients (incl. IDE's en AI-agents) op inpluggen. Acties met gevolgen vereisen menselijke toestemming."
    host_component: "foundation"
    config_source: "/opt/Foundation/server/mcpServer.js"
    configurable: false
    v3_note: "Input via MCP krijgt altijd status observation; nooit direct naar reflectie"

  - id: "capture-rs"
    name: "capture-rs"
    category: "capture"
    layer: "clients"
    epistemic: "observation"
    lifecycle: "active"
    repo: "capture-rs"
    description: "Windows-client (Rust): lokale scherm- en activiteitenopname aan clientzijde. Draait op de PC, niet op de VPS; voedt de Ingestie Gateway."
    status_source: "foundation-feed"
    status_match:
      field: "source"
      value: "capture-rs"
    freshness_window_seconds: 900
    configurable: false
    v3_note: "Client achter NAT: geen inbound bereikbaarheid, dus liveness komt uit de Foundation-ingestiefeed (nieuwste source=capture-rs). Geen open poort nodig; idle toont 'onbekend', nooit valselijk 'gestopt'."

  - id: "web"
    name: "Gaia Web"
    category: "interface"
    layer: "clients"
    epistemic: "presence"
    lifecycle: "interim"
    repo: "gaia-web (higaia.nl)"
    description: "Webclient: presence en interface naar dezelfde Gaia (geen instantie van haar)"
    container: "gaia-web"
    health_endpoint: "http://127.0.0.1:8090"
    ui_url: "https://higaia.nl"
    ui_label: "Open Gaia Web"
    config_source: "environment"
    configurable: false
    v3_note: "Migratie naar uniforme Gaia API is gepland (web-migration-plan); Logos draait interim nog client-side"

# INFRASTRUCTURE SERVICES
# Ondersteunende containers en datastores die geen logische Gaia-agent zijn
infrastructure:
  - id: "public-proxy"
    name: "Public HTTPS Ingress (Caddy)"
    container: "gaia-public-proxy"
    category: "ingress"
    description: "Caddy reverse proxy met automatisch Let's Encrypt SSL beheer voor higaia.nl"
    ports:
      - "80/tcp"
      - "443/tcp"

  - id: "chronicle-db"
    name: "Foundation Vector DB"
    container: "chronicle-db"
    category: "database"
    description: "Postgres 16 met pgvector voor Foundation/Chronicle (Drizzle-migraties). Hostpoort 5434, firewall dicht."
    ports:
      - "5434:5432"

  - id: "cognition-db"
    name: "Cognition Database"
    container: "gaia-cognition-db"
    category: "database"
    description: "Postgres 16 database voor Cognition hypotheses en patronen"
    ports:
      - "5432"

  - id: "hermes-proxy"
    name: "Hermes Auth Proxy"
    container: "gaia-hermes-proxy"
    category: "proxy"
    description: "Nginx proxy die interne authenticatietokens injecteert en Origin-headers stript voor Hermes API"
    ports:
      - "8643:80"
